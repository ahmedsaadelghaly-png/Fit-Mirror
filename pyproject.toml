# ---------------------------------------------------------------------------
# Shared code-quality tooling configuration for FitMirror AI.
#
# This file configures Ruff, Black, isort, and MyPy for BOTH `backend/` and
# `ai-service/`. Each service is still linted/typechecked independently
# (see Makefile) because both have a top-level `app` package and cannot be
# imported together in the same process — but they share one style config
# so the two codebases stay consistent.
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  alembic/versions
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "tests"]
skip = ["alembic/versions"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length is enforced by black instead
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom requires `Depends(...)` as an argument
# default — this is the documented, correct pattern, not a real bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["celery.*", "jose.*", "passlib.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true
