# Install once: pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^ai-service/app/.*  # avoid false positives on jinja-ish alembic templates
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (backend)
        files: ^backend/
        args: ["--settings-path=pyproject.toml"]
      - id: isort
        name: isort (ai-service)
        files: ^ai-service/
        args: ["--settings-path=pyproject.toml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy (backend)
        files: ^backend/app/
        additional_dependencies: ["pydantic==2.10.3", "sqlalchemy==2.0.36"]
        args: ["--config-file=pyproject.toml"]
      - id: mypy
        name: mypy (ai-service)
        files: ^ai-service/app/
        additional_dependencies: ["pydantic==2.10.3"]
        args: ["--config-file=pyproject.toml"]
