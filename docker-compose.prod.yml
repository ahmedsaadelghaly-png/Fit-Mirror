# ---------------------------------------------------------------------------
# FitMirror AI — PRODUCTION Docker Compose TEMPLATE.
#
# This is a complete, standalone reference file — NOT meant to be merged
# with docker-compose.yml (Compose concatenates list fields like `ports`
# across merged files rather than replacing them, so a partial "prod
# overrides" file can't reliably un-publish a port the base file exposes;
# a standalone file avoids that trap entirely).
#
# Review and adapt every section before using this in real production:
#   - Postgres/Redis/MinIO here are still single-node containers with local
#     volumes, included so this file is runnable as-is for a small
#     single-VM deployment. For real scale, swap them for managed services
#     (RDS/Cloud SQL, ElastiCache/Memorystore, S3) — the app only needs
#     correct connection strings/credentials via .env.production, since
#     storage and the database are already abstracted behind interfaces.
#   - Secrets must come from a secrets manager or your orchestrator's native
#     secret store, never from a committed .env file.
#   - `deploy.replicas` / resource limits are illustrative starting points;
#     size them from real load testing. `deploy:` keys only take effect
#     under `docker stack deploy` (Swarm) — under plain `docker compose up`
#     they're ignored except for `resources.limits`, which Compose does honor.
#
# Usage:
#   cp .env.production.example .env.production   # then fill in every CHANGE_ME
#   docker compose -f docker-compose.prod.yml up -d
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:16-alpine
    container_name: fitmirror-postgres
    restart: always
    env_file: .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    # No `ports:` — not published to the host. Only reachable by other
    # containers on the compose network. Prefer a managed DB in real prod.

  redis:
    image: redis:7-alpine
    container_name: fitmirror-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  minio:
    image: minio/minio:latest
    container_name: fitmirror-minio
    restart: always
    command: server /data --console-address ":9001"
    env_file: .env.production
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    # Prefer a real S3 bucket in production; this container exists so the
    # template is runnable standalone for small deployments.

  ai-service:
    build: ./ai-service
    restart: always
    env_file: .env.production
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2"
          memory: 2G
    # No `ports:` — internal only, called by the worker over the compose
    # network. Never expose the AI service directly to the internet.

  backend:
    build: ./backend
    restart: always
    env_file: .env.production
    ports:
      - "8000:8000"  # put a real reverse proxy / load balancer with TLS in front of this
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1G
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  worker:
    build: ./backend
    restart: always
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 3  # scale independently based on try-on queue depth
      resources:
        limits:
          cpus: "2"
          memory: 2G
    command: celery -A app.workers.celery_app worker --loglevel=info -Q tryon --concurrency=4

  # --- Scheduler: exactly one replica, or scheduled tasks run twice.
  beat:
    build: ./backend
    restart: always
    env_file: .env.production
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
    command: celery -A app.workers.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule

  # --- Frontend: Next.js, built via the `runner` stage in frontend/Dockerfile
  # (standalone output — see that file's comments). See
  # docs/DEPLOYMENT_FRONTEND.md for the full deployment guide, including
  # why NEXT_PUBLIC_* vars must be passed as build args, not just env vars.
  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_APP_ENV: production
        NEXT_PUBLIC_S3_PUBLIC_BASE_URL: ${NEXT_PUBLIC_S3_PUBLIC_BASE_URL:-}
        # Storage origin browsers upload to; the CSP blocks photo uploads without it.
        NEXT_PUBLIC_S3_PUBLIC_ENDPOINT_URL: ${NEXT_PUBLIC_S3_PUBLIC_ENDPOINT_URL:-}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"  # put a real reverse proxy / load balancer with TLS in front of this — see deploy/frontend/nginx.conf
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 512M

volumes:
  postgres_data:
  minio_data:
