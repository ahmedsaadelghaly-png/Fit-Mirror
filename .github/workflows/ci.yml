name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend-lint:
    name: Backend / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: cd backend && ruff check app tests
      - name: Black (check)
        run: cd backend && black --check app tests
      - name: isort (check)
        run: cd backend && isort --check-only app tests
      - name: MyPy
        run: cd backend && mypy --config-file=../pyproject.toml app

  backend-tests:
    name: Backend / Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitmirror
          POSTGRES_PASSWORD: fitmirror
          POSTGRES_DB: fitmirror_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitmirror"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      JWT_SECRET_KEY: ci-test-secret
      DATABASE_URL: postgresql+psycopg2://fitmirror:fitmirror@localhost:5432/fitmirror_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      AI_SERVICE_BASE_URL: http://localhost:8001/
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: fitmirror
      S3_SECRET_KEY: fitmirror123
      S3_BUCKET_NAME: fitmirror-media-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: cd backend && python -m pytest tests/unit --cov=app --cov-report=term-missing -m unit
      - name: Run integration tests
        run: cd backend && python -m pytest tests/integration -m integration

  ai-service-lint:
    name: AI Service / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: pip install -r ai-service/requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: cd ai-service && ruff check app tests
      - name: Black (check)
        run: cd ai-service && black --check app tests
      - name: isort (check)
        run: cd ai-service && isort --check-only app tests
      - name: MyPy
        run: cd ai-service && mypy --config-file=../pyproject.toml app

  ai-service-tests:
    name: AI Service / Tests
    runs-on: ubuntu-latest
    needs: ai-service-lint
    env:
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: fitmirror
      S3_SECRET_KEY: fitmirror123
      S3_BUCKET_NAME: fitmirror-media-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: pip install -r ai-service/requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: cd ai-service && python -m pytest tests/unit --cov=app --cov-report=term-missing -m unit

  frontend-lint:
    name: Frontend / Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier (check)
        run: npm run format:check
      - name: TypeScript
        run: npm run typecheck

  frontend-tests:
    name: Frontend / Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Vitest (with coverage)
        run: npm run test:coverage

  frontend-build:
    name: Frontend / Production Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (output: standalone — see docs/DEPLOYMENT_FRONTEND.md)
        run: npm run build
      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-standalone-build
          path: |
            frontend/.next/standalone
            frontend/.next/static
            frontend/public
          retention-days: 1

  frontend-e2e:
    name: Frontend / Playwright Smoke Tests
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e smoke tests (chromium only — see playwright.config.ts)
        run: npm run test:e2e -- --project=chromium

  frontend-a11y:
    name: Frontend / Accessibility Scan
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run axe-core scans (see docs/frontend/ACCESSIBILITY_AUDIT.md)
        run: npm run test:e2e:a11y -- --project=chromium

  frontend-lighthouse:
    name: Frontend / Lighthouse (non-blocking)
    runs-on: ubuntu-latest
    needs: frontend-build
    continue-on-error: true # Lighthouse scores are noisy on shared CI runners — informational, not a merge gate. See docs/frontend/PERFORMANCE.md.
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lighthouse CI
        run: npm run lighthouse

  docker-build-check:
    name: Docker / Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fitmirror-backend:ci ./backend
      - name: Build ai-service image
        run: docker build -t fitmirror-ai-service:ci ./ai-service
      - name: Build frontend image (runner stage — see frontend/Dockerfile)
        run: |
          docker build -t fitmirror-frontend:ci \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1 \
            --target runner \
            ./frontend
      - name: Validate docker-compose config
        run: docker compose -f docker-compose.yml config -q
      - name: Validate production docker-compose config
        # docker-compose.prod.yml's env_file: .env.production must exist on
        # disk — process env vars alone (the `env:` block below) aren't
        # enough, Compose still errors if the file itself is missing.
        run: |
          cp .env.production.example .env.production
          docker compose -f docker-compose.prod.yml config -q
        env:
          POSTGRES_USER: fitmirror
          POSTGRES_PASSWORD: fitmirror
          POSTGRES_DB: fitmirror
          S3_ACCESS_KEY: fitmirror
          S3_SECRET_KEY: fitmirror123
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com/api/v1
