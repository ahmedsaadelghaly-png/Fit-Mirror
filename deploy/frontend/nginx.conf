# ---------------------------------------------------------------------------
# Reference nginx config — reverse-proxies to the `frontend` (Next.js) and
# `backend` (FastAPI) containers from docker-compose.prod.yml, terminates
# TLS, and sets a static-asset caching strategy. See
# docs/DEPLOYMENT_FRONTEND.md "nginx" for how to wire this in.
#
# This is a TEMPLATE, not a drop-in for every environment: fill in
# `server_name` and the TLS certificate paths (or front this with a
# managed load balancer / Caddy / Cloudflare instead — nginx is one option
# among several, not a hard requirement of this stack).
# ---------------------------------------------------------------------------

upstream fitmirror_frontend {
  server frontend:3000;
}

upstream fitmirror_backend {
  server backend:8000;
}

server {
  listen 80;
  server_name _;
  # Redirect all plain HTTP to HTTPS once a real certificate is configured
  # below — commented out by default so this config is still usable
  # standalone (e.g. behind a load balancer that already terminates TLS).
  # return 301 https://$host$request_uri;

  location / {
    proxy_pass http://fitmirror_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next.js's build output under /_next/static/* is content-hashed and
  # therefore immutable — safe to cache for a year. Every other path
  # (HTML pages, /api/*) is NOT cached here; Next.js sets its own
  # Cache-Control per response for those.
  location /_next/static/ {
    proxy_pass http://fitmirror_frontend;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/v1/ {
    proxy_pass http://fitmirror_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Try-on job creation / uploads can legitimately take longer than
    # nginx's 60s default — see backend docs/STORAGE.md.
    proxy_read_timeout 120s;
  }
}

